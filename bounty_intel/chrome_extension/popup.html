<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; padding: 16px; font-family: -apple-system, sans-serif; background: #0f1117; color: #e1e4ed; }
  h3 { margin: 0 0 12px; font-size: 14px; }
  .status { font-size: 12px; padding: 8px; border-radius: 6px; margin-top: 8px; }
  .ok { background: rgba(34,197,94,0.15); color: #22c55e; }
  .err { background: rgba(239,68,68,0.15); color: #ef4444; }
  .loading { background: rgba(99,102,241,0.15); color: #6366f1; }
  button { width: 100%; padding: 10px; background: #6366f1; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: #2a2e3d; margin-top: 8px; }
  .muted { color: #8b8fa3; font-size: 11px; margin-top: 8px; }
  fieldset { border: 1px solid #2a2e3d; border-radius: 8px; margin: 12px 0 0; padding: 10px; }
  legend { font-size: 11px; color: #8b8fa3; padding: 0 4px; }
  label { display: block; font-size: 11px; color: #8b8fa3; margin-top: 6px; }
  input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; font-size: 12px; background: #0f1117; color: #e1e4ed; border: 1px solid #2a2e3d; border-radius: 6px; }
</style>
</head>
<body>
  <h3>Bounty Intel</h3>
  <button id="sync-btn">Sync Intigriti Now</button>
  <div id="status"></div>
  <div class="muted">Reads cookie from app.intigriti.com and syncs with your dashboard.</div>

  <fieldset>
    <legend>Settings</legend>
    <label for="dashboard-url">Dashboard URL</label>
    <input id="dashboard-url" type="url" placeholder="https://your-service.run.app" autocomplete="off">
    <label for="api-key">API key</label>
    <input id="api-key" type="password" placeholder="BOUNTY_INTEL_API_KEY" autocomplete="off">
    <button id="save-btn" class="secondary">Save</button>
    <div class="muted">Stored in this browser only, never in the repository.</div>
  </fieldset>

  <script src="popup.js"></script>
</body>
</html>
